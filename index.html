<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURAX MONTAÑISMO GT | Tienda Oficial & Expediciones</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #5CE1E6;
            --primary-dark: #00B4B0;
            --bg-dark: #0A0A0A;
            --bg-card: #121212;
            --bg-card-hover: #1A1A1A;
            --text-light: #FFFFFF;
            --text-gray: #B0B0B0;
            --accent-red: #FF4D4D;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'League Spartan', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header Navigation */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(92, 225, 230, 0.2);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        .logo-badge {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logo-badge span {
            color: var(--primary);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
            align-items: center;
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
            font-size: 0.95rem;
        }

        nav a:hover {
            color: var(--primary);
        }

        .cart-trigger {
            background: rgba(92, 225, 230, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .cart-trigger:hover {
            background: var(--primary);
            color: #000;
        }

        .cart-count {
            background: var(--accent-red);
            color: white;
            font-size: 0.8rem;
            padding: 2px 8px;
            border-radius: 50%;
        }

        /* Hero Section */
        .hero {
            position: relative;
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 130px 20px 60px;
            background: linear-gradient(180deg, rgba(10,10,10,0.75) 0%, rgba(10,10,10,1) 100%),
                        radial-gradient(circle at center, rgba(92, 225, 230, 0.18) 0%, transparent 70%);
        }

        .hero-content {
            max-width: 900px;
            z-index: 2;
        }

        .hero h1 {
            font-size: 3.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: var(--text-light);
            text-shadow: 0 0 20px rgba(92, 225, 230, 0.4);
        }

        .hero h1 span {
            color: var(--primary);
        }

        .hero-subtitle {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .hero-slogan {
            font-size: 1.35rem;
            font-style: italic;
            color: var(--text-gray);
            margin-bottom: 35px;
        }

        /* Buttons */
        .btn-main {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--primary);
            color: #000;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 14px 32px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 0 20px rgba(92, 225, 230, 0.4);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-main:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(92, 225, 230, 0.7);
            background-color: #72e8ec;
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: #FFF;
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.4);
        }

        .btn-whatsapp:hover {
            background-color: #20ba5a;
            box-shadow: 0 0 30px rgba(37, 211, 102, 0.7);
        }

        /* Sections Layout */
        section {
            padding: 85px 8%;
        }

        .section-title {
            text-align: center;
            font-size: 2.6rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 45px;
            position: relative;
            letter-spacing: 1px;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background: var(--primary);
            margin: 15px auto 0;
            border-radius: 2px;
            box-shadow: 0 0 10px var(--primary);
        }

        /* E-COMMERCE STORE */
        .store-filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            padding: 10px 22px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(92, 225, 230, 0.3);
        }
